<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FoodDash - Forgot Password</title>

  
</head>
<body>

    <div class="forgot-container">

        <!-- Logo -->
        <div class="logo">
            <img src="images/logo.png" alt="FoodDash Logo">
            <h2>Food<span>Dash</span></h2>
        </div>

        <!-- Forgot Password Form -->
        <div class="forgot-box">

            <div class="icon">🔐</div>

            <h1>Forgot Password?</h1>

            <p class="description">
                Don't worry! Enter the email address linked
                to your account and we'll help you reset your password.
            </p>

            <form id="forgotPasswordForm">

                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email address"
                    required
                >

                <button type="submit" id="forgotbutton">
                    Reset Password
                </button>

                

                <p id="message" aria-live="polite"></p>

            </form>

            <a href="login.html" class="back-link">
                ← Back to Login
            </a>

        </div>

        <p class="footer">
            Hungry? We've got you covered! 🍔
        </p>

    </div>

        <script src="./auth/forgotPassword.js" type="module"></script>
    </body>
</html>
